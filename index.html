<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EnggInstitutes — Engineering Colleges of India</title>
  <meta name="description" content="Search and browse engineering institutes across India" />

  <!-- Main CSS -->
  <style>
    :root{--bg:#0f1724;--card:#0b1220;--muted:#9aa4b2;--accent:#1e90ff;--glass: rgba(255,255,255,0.04)}
    html,body{height:100%;margin:0;font-family:Inter, ui-sans-serif, system-ui; background:#071428;color:#e6eef6;} 
    .container{max-width:1250px;margin:28px auto;padding:20px}
    header{margin-bottom:20px}
    h1{font-size:26px;margin:0 0 6px 0}
    .subtitle{color:var(--muted);font-size:14px;margin-bottom:16px}

    .filters{display:flex;flex-wrap:wrap;gap:12px;background:var(--card);padding:16px;border-radius:12px}
    select,input[type=text]{background:var(--glass);border:1px solid rgba(255,255,255,0.04);padding:10px 12px;border-radius:8px;color:inherit;min-width:180px}

    .table-wrap{background:var(--card);margin-top:20px;border-radius:12px;padding:10px}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:10px 8px;text-align:left;border-bottom:1px solid rgba(255,255,255,0.05)}
    th{font-weight:600;color:#cfe6ff;font-size:13px}
    tr:hover td{background:rgba(255,255,255,0.04)}
    a{color:var(--accent);text-decoration:none}

    @media(max-width:700px){table{font-size:12px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>EnggInstitutes — Engineering Institutes of India</h1>
      <div class="subtitle">Browse engineering institutes across India by state & category.</div>
    </header>

    <!-- FILTERS -->
    <div class="filters">
      <input id="search" type="text" placeholder="Search by name, city, district...">

      <select id="stateFilter">
        <option value="">All States</option>
      </select>

      <select id="categoryFilter">
        <option value="">All Categories</option>
        <option value="iit">IITs</option>
        <option value="nit">NITs</option>
        <option value="iiit">IIITs</option>
        <option value="central">Central Universities</option>
        <option value="state">State Universities</option>
        <option value="deemed">Deemed Universities</option>
        <option value="affiliated">Affiliated Colleges</option>
      </select>
    </div>

    <!-- TABLE -->
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Rank</th>
            <th>Name</th>
            <th>Category</th>
            <th>State</th>
            <th>City</th>
            <th>Website</th>
          </tr>
        </thead>
        <tbody id="tableBody"></tbody>
      </table>
    </div>
  </div>

  <!-- Load category datasets -->
  <script src="data/iits.js"></script>
  <script src="data/nits.js"></script>
  <script src="data/iiits.js"></script>
  <script src="data/central.js"></script>
  <script src="data/state_universities.js"></script>
  <script src="data/deemed_universities.js"></script>
  <script src="data/affiliated_colleges.js"></script>

  <script>
    // Combine all data
    let data = [
      ...IITS_DATA,
      ...NITS_DATA,
      ...IIITS_DATA,
      ...CENTRAL_UNIV_DATA,
      ...STATE_UNIV_DATA,
      ...DEEMED_UNIV_DATA,
      ...AFFILIATED_COLLEGES_DATA
    ];

    const searchInput = document.getElementById('search');
    const stateFilter = document.getElementById('stateFilter');
    const categoryFilter = document.getElementById('categoryFilter');
    const tableBody = document.getElementById('tableBody');

    // Populate STATES dynamically
    const states = [...new Set(data.map(d => d.state))].sort();
    states.forEach(s => stateFilter.innerHTML += `<option value="${s}">${s}</option>`);

    // Refresh table
    function render(){
      const q = searchInput.value.toLowerCase();
      const st = stateFilter.value;
      const ca = categoryFilter.value;

      const filtered = data.filter(d => {
        if(st && d.state !== st) return false;
        if(ca && d.category !== ca) return false;
        if(q && !d.name.toLowerCase().includes(q) && !d.city.toLowerCase().includes(q)) return false;
        return true;
      });

      tableBody.innerHTML = filtered.map(r => `
        <tr>
          <td>${r.rank || ''}</td>
          <td>${r.name}</td>
          <td>${(r.category || '').toUpperCase()}</td>
          <td>${r.state}</td>
          <td>${r.city}</td>
          <td><a href="${r.website}" target="_blank">site</a></td>
        </tr>
      `).join('');
    }

    searchInput.oninput = render;
    stateFilter.onchange = render;
    categoryFilter.onchange = render;

    render();
  </script>
</body>
</html>
